<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration — Vyaapaar E-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <span class="brand-badge">व्यापार</span>
                <span>VYAAPAAR</span>
            </a>

            <ul class="nav-links" style="margin-left: auto;">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Products</a></li>
                <li><a href="/login.html" class="btn btn-outline btn-sm">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="auth-wrapper" style="max-width: 540px;">
            <div class="auth-header">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join Vyaapaar to start shopping with real-time order tracking</p>
            </div>

            <div id="register-alert" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius); margin-bottom: 1.5rem; font-size: 0.9rem;"></div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name <span style="color: var(--danger);">*</span></label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g., Ananya Deshmukh" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address <span style="color: var(--danger);">*</span></label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g., ananya@gmail.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password <span style="color: var(--danger);">*</span></label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 4 characters" required minlength="4" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-phone">Phone Number</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="e.g., 9876543210">
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-address">Delivery / Shipping Address <span style="color: var(--danger);">*</span></label>
                    <textarea id="reg-address" class="form-control" placeholder="Enter complete shipping address with street, city, pin code..." required></textarea>
                </div>

                <button type="submit" id="reg-btn" class="btn btn-primary btn-block" style="padding: 0.85rem; margin-top: 1.5rem;">
                    Complete Registration →
                </button>
            </form>

            <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid var(--border); padding-top: 1.25rem;">
                <p style="color: var(--text-secondary); font-size: 0.95rem;">
                    Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign in here</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p><strong>Vyaapaar E-Commerce System</strong> — Java SE 17 & MySQL</p>
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const phone = document.getElementById('reg-phone').value.trim();
            const address = document.getElementById('reg-address').value.trim();

            const alertBox = document.getElementById('register-alert');
            const submitBtn = document.getElementById('reg-btn');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Creating account...';

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullName: fullName,
                        email: email,
                        password: password,
                        phone: phone,
                        address: address
                    })
                });

                const data = await res.json();
                if (data.success) {
                    alertBox.style.display = 'block';
                    alertBox.style.background = 'var(--success-light)';
                    alertBox.style.color = 'var(--success)';
                    alertBox.style.border = '1px solid rgba(16, 185, 129, 0.3)';
                    alertBox.innerHTML = `✅ ${escapeHtml(data.message)} Redirecting to login...`;

                    showToast('Account registered successfully!', 'success');
                    setTimeout(() => window.location.href = '/login.html', 1200);
                } else {
                    alertBox.style.display = 'block';
                    alertBox.style.background = 'var(--danger-light)';
                    alertBox.style.color = 'var(--danger)';
                    alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
                    alertBox.innerHTML = `⚠️ ${escapeHtml(data.error || 'Registration failed.')}`;
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.style.background = 'var(--danger-light)';
                alertBox.style.color = 'var(--danger)';
                alertBox.innerHTML = `⚠️ Network error: ${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Complete Registration →';
            }
        });
    </script>
</body>
</html>
