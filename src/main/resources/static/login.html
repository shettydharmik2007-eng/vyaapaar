<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login — Vyaapaar E-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <span class="brand-badge">व्यापार</span>
                <span>VYAAPAAR</span>
            </a>

            <ul class="nav-links" style="margin-left: auto;">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Products</a></li>
                <li><a href="/register.html" class="btn btn-outline btn-sm">Register</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="auth-wrapper">
            <div class="auth-header">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your Vyaapaar customer account</p>
            </div>

            <div id="login-alert" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius); margin-bottom: 1.5rem; font-size: 0.9rem;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="e.g., rahul@gmail.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-block" style="padding: 0.85rem; margin-top: 1.5rem;">
                    Sign In →
                </button>
            </form>

            <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid var(--border); padding-top: 1.25rem;">
                <p style="color: var(--text-secondary); font-size: 0.95rem;">
                    Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Register here</a>
                </p>
            </div>

            <!-- Quick Demo Credentials helper box -->
            <div style="background: var(--surface-alt); border-radius: var(--radius); padding: 1rem; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-secondary);">
                <div style="font-weight: 700; margin-bottom: 0.25rem;">💡 Demo Customer Accounts:</div>
                <div>• <code>rahul@gmail.com</code> / <code>rahul123</code></div>
                <div>• <code>priya@gmail.com</code> / <code>priya123</code></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p><strong>Vyaapaar E-Commerce System</strong> — Java SE 17 & MySQL</p>
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const alertBox = document.getElementById('login-alert');
            const submitBtn = document.getElementById('login-btn');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Signing in...';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await res.json();
                if (data.success && data.user) {
                    setCurrentUser(data.user);
                    showToast(`Welcome back, ${data.user.fullName}!`, 'success');

                    const redirect = sessionStorage.getItem('auth_redirect') || '/products.html';
                    sessionStorage.removeItem('auth_redirect');
                    setTimeout(() => window.location.href = redirect, 600);
                } else {
                    alertBox.style.display = 'block';
                    alertBox.style.background = 'var(--danger-light)';
                    alertBox.style.color = 'var(--danger)';
                    alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
                    alertBox.innerHTML = `⚠️ ${escapeHtml(data.error || 'Invalid credentials.')}`;
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.style.background = 'var(--danger-light)';
                alertBox.style.color = 'var(--danger)';
                alertBox.innerHTML = `⚠️ Network error: ${err.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In →';
            }
        });
    </script>
</body>
</html>
