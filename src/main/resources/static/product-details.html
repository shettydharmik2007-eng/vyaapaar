<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details — Vyaapaar E-Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="brand-logo">
                <span class="brand-badge">व्यापार</span>
                <span>VYAAPAAR</span>
            </a>

            <form id="nav-search-form" class="nav-search">
                <span class="search-icon">🔍</span>
                <input type="text" id="nav-search-input" placeholder="Search products...">
            </form>

            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Products</a></li>
                <li>
                    <a href="/cart.html" class="cart-btn">
                        <span>🛒 Cart</span>
                        <span id="cart-badge" class="cart-badge">0</span>
                    </a>
                </li>
                <li id="nav-auth-links">
                    <a href="/login.html" class="nav-link">Login</a>
                    <a href="/register.html" class="btn btn-primary btn-sm">Register</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div style="margin-bottom: 1.5rem;">
            <a href="/products.html" class="btn btn-outline btn-sm">← Back to Catalog</a>
        </div>

        <div id="detail-loading" style="text-align: center; padding: 4rem; color: var(--text-muted);">
            <p>Loading product details...</p>
        </div>

        <div id="product-detail" class="product-detail-layout" style="display: none;">
            <div id="detail-icon-box" class="detail-img-box">
                📦
            </div>

            <div class="detail-info">
                <span id="detail-category" class="product-category" style="font-size: 0.9rem;">Electronics</span>
                <h1 id="detail-name" style="font-size: 2.2rem; font-weight: 800; line-height: 1.25; margin: 0.5rem 0;">Product Name</h1>

                <div style="display: flex; align-items: center; gap: 1rem; margin: 0.5rem 0;">
                    <span id="detail-stock-badge" class="stock-tag stock-in">In Stock</span>
                    <span id="detail-stock-text" style="color: var(--text-secondary); font-size: 0.95rem;">25 units available</span>
                </div>

                <div id="detail-price" class="detail-price">₹0.00</div>

                <div style="background: var(--surface-alt); padding: 1.25rem; border-radius: var(--radius); margin: 1rem 0;">
                    <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem;">Product Description</h3>
                    <p id="detail-description" style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6;">Description text</p>
                </div>

                <!-- Quantity and Add to Cart Section -->
                <div style="margin-top: 1.5rem;">
                    <label style="font-size: 0.95rem; font-weight: 700; display: block; margin-bottom: 0.5rem;">Select Quantity:</label>
                    <div class="qty-control">
                        <button type="button" class="qty-btn" onclick="adjustQty(-1)">-</button>
                        <input type="number" id="qty-input" class="qty-input" value="1" min="1" max="99" onchange="validateQty()">
                        <button type="button" class="qty-btn" onclick="adjustQty(1)">+</button>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                        <button id="add-to-cart-btn" onclick="addToCart()" class="btn btn-primary" style="flex: 1; padding: 0.9rem;">
                            🛒 Add to Shopping Cart
                        </button>
                        <a href="/cart.html" class="btn btn-outline" style="padding: 0.9rem;">
                            View Cart →
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p><strong>Vyaapaar E-Commerce System</strong> — Java SE 17 & MySQL</p>
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script src="/js/app.js"></script>
    <script>
        let currentProduct = null;
        let availableStock = 0;

        async function loadProductDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.getElementById('detail-loading').innerHTML = `
                    <div style="background: var(--danger-light); color: var(--danger); padding: 1.5rem; border-radius: var(--radius);">
                        ⚠️ No Product ID specified. <a href="/products.html">Return to Catalog</a>
                    </div>
                `;
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/products/${productId}`);
                const data = await res.json();

                if (!res.ok || data.success === false) {
                    throw new Error(data.error || 'Product not found');
                }

                currentProduct = data;
                availableStock = currentProduct.stockQuantity || 0;

                // Populate UI
                document.title = `${currentProduct.name} — Vyaapaar`;
                document.getElementById('detail-name').innerText = currentProduct.name;
                document.getElementById('detail-category').innerText = currentProduct.categoryName || 'General';
                document.getElementById('detail-description').innerText = currentProduct.description || 'No description available.';
                document.getElementById('detail-price').innerText = formatCurrency(currentProduct.price);
                document.getElementById('detail-icon-box').innerText = getProductIcon(currentProduct.categoryId);

                const stockBadge = document.getElementById('detail-stock-badge');
                const stockText = document.getElementById('detail-stock-text');
                const addBtn = document.getElementById('add-to-cart-btn');
                const qtyInput = document.getElementById('qty-input');

                if (availableStock === 0) {
                    stockBadge.className = 'stock-tag stock-out';
                    stockBadge.innerText = 'Out of Stock';
                    stockText.innerText = 'Currently unavailable in warehouse';
                    addBtn.disabled = true;
                    addBtn.innerText = 'Out of Stock';
                    qtyInput.disabled = true;
                } else if (availableStock <= 5) {
                    stockBadge.className = 'stock-tag stock-low';
                    stockBadge.innerText = 'Low Stock';
                    stockText.innerText = `Only ${availableStock} left in stock - Order soon!`;
                    qtyInput.max = availableStock;
                } else {
                    stockBadge.className = 'stock-tag stock-in';
                    stockBadge.innerText = 'In Stock';
                    stockText.innerText = `${availableStock} units available in warehouse`;
                    qtyInput.max = availableStock;
                }

                document.getElementById('detail-loading').style.display = 'none';
                document.getElementById('product-detail').style.display = 'grid';

            } catch (err) {
                document.getElementById('detail-loading').innerHTML = `
                    <div style="background: var(--danger-light); color: var(--danger); padding: 1.5rem; border-radius: var(--radius);">
                        ⚠️ ${escapeHtml(err.message)} <br><br>
                        <a href="/products.html" class="btn btn-outline btn-sm">Return to Catalog</a>
                    </div>
                `;
            }
        }

        function adjustQty(delta) {
            const input = document.getElementById('qty-input');
            let val = parseInt(input.value) || 1;
            val += delta;
            if (val < 1) val = 1;
            if (availableStock > 0 && val > availableStock) val = availableStock;
            input.value = val;
        }

        function validateQty() {
            const input = document.getElementById('qty-input');
            let val = parseInt(input.value) || 1;
            if (val < 1) val = 1;
            if (availableStock > 0 && val > availableStock) val = availableStock;
            input.value = val;
        }

        async function addToCart() {
            if (!currentProduct || availableStock <= 0) return;

            const user = getCurrentUser();
            if (!user) {
                showToast('Please log in to add items to your cart.', 'error');
                sessionStorage.setItem('auth_redirect', window.location.href);
                setTimeout(() => window.location.href = '/login.html', 800);
                return;
            }

            const qty = parseInt(document.getElementById('qty-input').value) || 1;
            const addBtn = document.getElementById('add-to-cart-btn');
            addBtn.disabled = true;
            addBtn.innerText = 'Adding...';

            try {
                const res = await fetch(`${API_BASE}/cart/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: user.userId,
                        productId: currentProduct.productId,
                        quantity: qty
                    })
                });

                const data = await res.json();
                if (data.success) {
                    showToast(`Added ${qty} unit(s) of "${currentProduct.name}" to cart!`, 'success');
                    updateCartBadge();
                } else {
                    showToast(data.error || 'Failed to add item to cart.', 'error');
                }
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            } finally {
                addBtn.disabled = false;
                addBtn.innerText = '🛒 Add to Shopping Cart';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProductDetail);
    </script>
</body>
</html>
